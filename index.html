<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RBCC - Royal Bengal Cricket Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Oswald', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; /* Slate 900 */
      }
      ::-webkit-scrollbar-thumb {
        background: #DC2626; /* Red-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B91C1C;
      }
      .stadium-bg {
        background-image: url('https://images.unsplash.com/photo-1531415074968-036ba1b575da?q=80&w=2067&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
      /* Custom Clip Path for sporty slant */
      .clip-slant {
        clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
      }
      .clip-slant-rev {
         clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%);
      }
    </style>
